<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="description"
      content="Press Releases from Impact Colliders – company updates, announcements, and milestones."
    />
    <meta name="author" content="Impact Colliders" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap"
      rel="stylesheet"
    />
    <title>Press Releases - Impact Colliders</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/logo.jpg" />
    <link
      rel="stylesheet"
      type="text/css"
      href="assets/css/bootstrap.min.css"
    />
    <link rel="stylesheet" type="text/css" href="assets/css/font-awesome.css" />
    <link rel="stylesheet" href="assets/css/templatemo-lava.css" />
    <link rel="stylesheet" href="assets/css/owl-carousel.css" />
    <style>
      body {
        font-family: Poppins, sans-serif;
        background: #f5f5f5;
      }

      .section {
        padding: 60px 0 80px;
      }

      .page-hero {
        padding: 160px 10% 60px;
        text-align: center;
        background: #ffffff;
      }
      .page-hero .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 18px;
        padding: 8px 16px;
        background: #fff;
        color: #004aad;
        border: 1.5px solid #004aad;
        border-radius: 999px;
        font-size: 0.88rem;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .page-hero .back-link:hover {
        background: #004aad;
        color: #fff;
        text-decoration: none;
      }
      .page-hero .back-link svg { width: 14px; height: 14px; }
      .page-hero h1 {
        font-size: 42px;
        font-weight: 700;
        color: #004aad;
        margin-bottom: 20px;
      }
      .page-hero h1 em {
        color: #004aad;
        font-style: normal;
      }
      .page-hero p {
        max-width: 700px;
        margin: auto;
        font-size: 16px;
        color: #666;
        line-height: 1.6;
      }

      .press-list {
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 20px;
        display: grid;
        gap: 30px;
      }

      .press-empty {
        text-align: center;
        color: #888;
        padding: 40px 20px;
      }

      .press-card {
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        display: grid;
        grid-template-columns: 280px 1fr;
        transition: transform 0.3s, box-shadow 0.3s;
      }
      .press-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
      }

      .press-card-image {
        width: 280px;
        aspect-ratio: 1 / 1;
        background-color: #eee;
      }
      .press-card-image a {
        display: block;
        width: 100%;
        height: 100%;
      }
      .press-card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        display: block;
      }

      .press-card-body {
        padding: 28px 30px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .press-card-date {
        font-size: 13px;
        font-weight: 600;
        color: #ff6b6b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }

      .press-card-title {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 12px;
        line-height: 1.3;
      }
      .press-card-title a {
        color: #004aad;
        text-decoration: none;
      }
      .press-card-title a:hover {
        color: #003580;
        text-decoration: none;
      }

      .press-card-summary {
        font-size: 15px;
        color: #555;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .press-card-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #ff6b6b;
        color: #fff;
        padding: 10px 22px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        transition: 0.3s;
        align-self: flex-start;
      }
      .press-card-link:hover {
        transform: translateY(-2px);
        background: #ff5252;
        color: #fff;
        text-decoration: none;
      }
      .press-card-link svg {
        flex-shrink: 0;
      }

      @media (max-width: 768px) {
        .page-hero {
          padding: 140px 6% 40px;
        }
        .page-hero h1 {
          font-size: 30px;
        }
        .press-card {
          grid-template-columns: 1fr;
        }
        .press-card-image {
          width: 100%;
          aspect-ratio: 1 / 1;
          max-height: 420px;
        }
        .press-card-body {
          padding: 22px 22px 26px;
        }
        .press-card-title {
          font-size: 19px;
        }
      }
    </style>
  </head>

  <body>
    <div id="preloader">
      <div class="jumper">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>

    <!-- Nav Bar -->
    <header class="header-area header-sticky" id="nav-placeholder"></header>

    <!-- Hero -->
    <section class="page-hero">
      <a class="back-link" href="/" id="backLink" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back
      </a>
      <h1>Press <em>Releases</em></h1>
      <p>
        Stay up to date with the latest news, announcements, and milestones
        from Impact Colliders as we continue our journey to create games that
        make a meaningful impact.
      </p>
    </section>

    <!-- Press Releases -->
    <section class="section" id="press-releases">
      <div class="press-list" id="press-list"></div>
    </section>

    <!-- Footer -->
    <footer id="contact-us">
      <div class="container" id="contact-container">
        <!-- Contact form will be injected here -->
      </div>
    </footer>

    <script src="press-releases-data.js"></script>
    <script>
      (function renderPressList() {
        const container = document.getElementById("press-list");
        const items = (window.PRESS_RELEASES || []);

        if (!items.length) {
          container.innerHTML =
            '<div class="press-empty">No press releases yet. Check back soon.</div>';
          return;
        }

        const escapeHtml = (str) =>
          String(str).replace(/[&<>"']/g, (c) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c]));

        const deriveSummary = (body) => {
          const tmp = document.createElement("div");
          tmp.innerHTML = body || "";
          const p = tmp.querySelector("p");
          return p ? p.textContent.replace(/\s+/g, " ").trim() : "";
        };

        container.innerHTML = items
          .map((item) => {
            const href = `press-release?slug=${encodeURIComponent(item.slug)}`;
            const alt = escapeHtml(item.imageAlt || item.title);
            const summary = item.summary || deriveSummary(item.body);
            return `
              <article class="press-card">
                <div class="press-card-image">
                  <a href="${href}">
                    <img src="${escapeHtml(item.image)}" alt="${alt}" />
                  </a>
                </div>
                <div class="press-card-body">
                  <div class="press-card-date">${escapeHtml(item.date)}</div>
                  <h2 class="press-card-title">
                    <a href="${href}">${escapeHtml(item.title)}</a>
                  </h2>
                  <p class="press-card-summary">${escapeHtml(summary)}</p>
                  <a class="press-card-link" href="${href}">
                    Read More
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                      <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                  </a>
                </div>
              </article>
            `;
          })
          .join("");
      })();
    </script>

    <script src="mailinglist.js"></script>
    <script src="assets/js/jquery-2.1.0.min.js"></script>
    <script src="assets/js/popper.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/owl-carousel.js"></script>
    <script src="assets/js/scrollreveal.min.js"></script>
    <script src="assets/js/waypoints.min.js"></script>
    <script src="assets/js/jquery.counterup.min.js"></script>
    <script src="assets/js/imgfix.min.js"></script>
    <script src="navbar.js"></script>
    <script src="assets/js/custom.js"></script>
    <script>
      // Back button: go to previous page if user navigated here from the
      // same site; otherwise fall back to the link's href (home).
      (function () {
        var link = document.getElementById("backLink");
        if (!link) return;
        link.addEventListener("click", function (e) {
          var ref = document.referrer || "";
          var sameOrigin = ref.indexOf(window.location.origin) === 0;
          if (sameOrigin && window.history.length > 1) {
            e.preventDefault();
            window.history.back();
          }
        });
      })();
    </script>
  </body>
</html>
