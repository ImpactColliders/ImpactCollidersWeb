<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutorial - Impact Colliders</title>

    <link rel="icon" type="image/x-icon" href="/assets/images/logo.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/font-awesome.css" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      img, iframe { display: block; }

      body {
        font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
      }

      /* width wrapper used by the injected global nav */
      .container {
        width: 100%;
        max-width: 1140px;
        margin: 0 auto;
        padding: 0 16px;
      }

      /* Center the injected global nav within its 90px bar (the site's
         template CSS normally does this; this page is standalone). */
      #nav-placeholder.header-area {
        display: flex;
        align-items: center;
      }
      #nav-placeholder .main-nav {
        height: auto;
      }

      /* Video */
      .video-stage {
        flex: 1 1 auto;
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
        padding: 40px 16px 64px;
      }
      .video-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.15);
      }
      .video-frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      @media (max-width: 600px) {
        .video-stage { padding: 24px 12px 48px; }
      }
    </style>
  </head>

  <body>
    <!-- Global nav (injected by navbar.js) -->
    <header class="header-area header-sticky" id="nav-placeholder"></header>

    <main class="video-stage">
      <div class="video-frame">
        <iframe
          src="https://www.youtube.com/embed/1gVka8yF524?rel=0"
          title="Tutorial — Impact Colliders"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
    </main>

    <!-- Footer (injected by mailinglist.js) -->
    <footer id="contact-us">
      <div class="container" id="contact-container"></div>
    </footer>

    <script src="/navbar.js"></script>
    <script src="/mailinglist.js"></script>
  </body>
</html>
