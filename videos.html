      /* ============================================================
         RESPONSIVE VIDEO DISPLAY (overrides the rules above)
         Portrait (9:16) tutorial videos, centred and sized to fit
         the viewport on desktop and fill the width on mobile.
         Targets the .video-section step containers that actually
         render the iframe (the intended .video-wrapper is not built).
         ============================================================ */

      body { padding-top: 0; }

      /* overflow-x: clip prevents horizontal scroll WITHOUT making <body>
         a scroll container — "hidden" would break the sticky button row. */
      html, body { overflow-x: clip; }

      /* ----- No header layout shift on scroll -----
         templatemo's custom.js adds a "background-header" class once you
         start scrolling. Its CSS is `position: fixed !important;
         height: 80px !important`, which switches the header from in-flow
         (sticky) to out-of-flow (fixed) and changes its height — making the
         page jump. Lock the header's box to the SAME values in BOTH states
         (sticky, in normal flow, fixed 80px height) so only the background/
         shadow from background-header can change. Because it stays sticky
         (in flow), its 80px height is already reserved — no body padding
         needed and nothing jumps. */
      .header-area,
      .header-area.background-header {
        position: sticky !important;
        top: 0 !important;
        height: 80px !important;
        min-height: 80px !important;
        margin: 0 !important;
      }

      .content-container {
        max-width: 760px;
        /* generous, viewport-WIDTH-based gap before the footer so the
           "Quick Links" area is never cramped/cut off (esp. iOS Safari) */
        margin: 24px auto clamp(48px, 9vw, 88px);
        padding: 0 16px;
      }

      /* No white "card": the nav row and the video sit as separate,
         standalone blocks directly on the page. */
      .content-container section {
        height: auto;
        background: transparent;
        box-shadow: none;
        border-radius: 0;
        padding: 0;
        margin: 0;
        text-align: center;
      }
      .content-container section h2 {
        text-align: center;
        font-size: clamp(1.15rem, 3.5vw, 1.5rem);
        /* Large gap above so the sticky button bar never blocks the
           title; smaller gap below to the video. */
        margin: clamp(20px, 5vw, 32px) 0 24px;
      }
      .content-container section > br { display: none; }

      /* Standalone navigation row (Prev · Back · Next) ABOVE the video.
         Sticky just below the 90px global nav so it always stays below the
         nav and is never overlapped when scrolling back up. */
      .video-holder {
        display: flex;
        gap: 8px;
        justify-content: center;
        align-items: stretch;
        max-width: 520px;
        margin: 0 auto;
        flex-wrap: nowrap;

      }
      .video-holder .video-arrow:hover,

      /* Portrait (9:16) video frame — sized by WIDTH (capped), never by
         viewport height, so the layout doesn't shift with iOS Safari's
         dynamic toolbar. Only one step is shown at a time (JS toggles). */
      .content-container .video-section {

     function loadYoutubeStep(iframe, videoId, startTime, autoplay = true) {
  iframe.src = "";

  requestAnimationFrame(() => {
    const params = new URLSearchParams({
      autoplay: autoplay ? 1 : 0,
      start: startTime ?? 0,
      rel: 0,
      modestbranding: 1,
      playsinline: 1
    });

    iframe.src = `https://www.youtube.com/embed/${videoId}?${params.toString()}`;
  });
}


      // Modified goToSiblingSection to take a wrapper parameter
      function goToSiblingSectionWithVideo(wrapper, direction) {
        const sections = wrapper.querySelectorAll(".video-section");
        let currentIndex = -1;

        sections.forEach((sec, i) => {
          if (sec.style.display !== "none") currentIndex = i - 1;
        });
        if (currentIndex === -1) return;

        let nextIndex = currentIndex + direction;

        // Clamp nextIndex between 0 and sections.length - 1
        if (nextIndex < 0) nextIndex = 0;
        if (nextIndex >= sections.length) nextIndex = sections.length - 1;

        sections.forEach((sec, i) => {
          const video = sec.querySelector("video");
          if (!video) return;

          if (i === nextIndex) {
            sec.style.display = "flex";

            // Set the video time according to the step
            const wrapperIndex = wrapper.dataset.index - 1;
            const videoData = videos[wrapperIndex];
            let startTime = 0;
            switch (nextIndex) {
              case 0:
                startTime = videoData.time1 || 0;
                break;
              case 1:
                startTime = videoData.time2 || 0;
                break;
              case 2:
                startTime = videoData.time3 || 0;
                break;
              case 3:
                startTime = videoData.time4 || 0;
                break;
            }

            // Only advance if the current time is behind startTime
            if (video.currentTime < startTime) video.currentTime = startTime;
            video.play().catch(() => {});
          } else {
            sec.style.display = "none";
            video.pause();
          }
        });
      }

  }
} else {
  messageEl.textContent =
    "Please specify a section via ?show=1 (or 2, 3) or ?show=all";
}

function loadInitialVideoForSection(sectionIndex) {
  const section = document.querySelector(
    `section[data-index="${sectionIndex}"]`
  );
  if (!section) return;

  const iframe = section.querySelector('iframe[data-step="0"]');
  if (!iframe) return;

  const videoData = videos[sectionIndex - 1];

  // Set the embed src DIRECTLY (no blank-then-rAF reassign). The
  // reset pattern in loadYoutubeStep leaves the iframe on about:blank
  // (black) on iOS Safari, even though desktop browsers recover.
  const params = new URLSearchParams({
    autoplay: 0,
    start: 0,
    rel: 0,
    modestbranding: 1,
    playsinline: 1
  });
  iframe.src =
    "https://www.youtube.com/embed/" +
    videoData.youtubeId +
    "?" +
    params.toString();
}

          navigator.clipboard
            .writeText(url)
            .then(() => {
              btn.textContent = "Copied!";
              setTimeout(() => (btn.textContent = "Copy URL"), 1500);
            })
            .catch(() => alert("Failed to copy URL"));
        });
      });

      // Copy QR Code buttons
      document.querySelectorAll("button.copy-qr-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const sectionId = btn.getAttribute("data-section");
          const url = `https://www.impactcolliders.com/videos.html?show=${sectionId}`;
          try {
            const container = document.createElement("div");
            container.style.position = "fixed";
            container.style.left = "-9999px";
            document.body.appendChild(container);

            const qr = new QRCode(container, {
              text: url,
              width: 256,
              height: 256,
              correctLevel: QRCode.CorrectLevel.H,
            });

            await new Promise((resolve) => setTimeout(resolve, 100));
            let img = container.querySelector("img");
            let canvas;
            if (img) {
              canvas = document.createElement("canvas");
              canvas.width = img.naturalWidth;
              canvas.height = img.naturalHeight;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0);
            } else {
              canvas = container.querySelector("canvas");
            }

            if (!canvas)
              throw new Error("Could not find QR code image or canvas.");

            canvas.toBlob(async (blob) => {
              if (!blob) {
                alert("Failed to convert QR code to image.");
                container.remove();
                return;
              }
              try {
                await navigator.clipboard.write([
                  new ClipboardItem({ "image/png": blob }),
                ]);
                btn.textContent = "QR Copied!";
                setTimeout(() => (btn.textContent = "Copy QR Code"), 1500);
              } catch {
                alert(
                  "Failed to copy QR code image. Your browser may not support this."
                );
              }
              container.remove();
            });
          } catch (err) {
            alert("Error generating or copying QR code: " + err.message);
          }
        });
      });

      function switchVideoSection(button, direction) {
        const wrapper = button.closest(".video-wrapper");
        if (!wrapper) return;

        const sections = wrapper.querySelectorAll(".video-section");
        let currentIndex = -1;

        // Find currently visible section
        sections.forEach((sec, i) => {
          if (sec.style.display !== "none") {
            currentIndex = i;
          }
        });

        if (currentIndex === -1) return;

        const nextIndex =
          (currentIndex + direction + sections.length) % sections.length;

        sections.forEach((sec, i) => {
          const iframe = sec.querySelector("iframe");
          if (!iframe) return;

          let src = iframe.getAttribute("src");
          src = src.replace(/&?mute=\d/, ""); // Remove existing mute param

          if (i === nextIndex) {
            sec.style.display = "block";
            // Unmute the active one
            iframe.setAttribute("src", updateUrlParam(src, "mute", "0"));
          } else {
            sec.style.display = "none";
            // Mute the hidden ones
            iframe.setAttribute("src", updateUrlParam(src, "mute", "1"));
          }
        });
      }

      function resetIframeVideo(iframe) {
        const src = iframe.getAttribute("src");
        iframe.setAttribute("src", src); // Reloads iframe and resets video state
      }

      function resetIframeVideo(iframe) {
        const src = iframe.getAttribute("src");
        iframe.setAttribute("src", src);
      }

      function updateUrlParam(url, param, value) {
        const baseUrl = url.split("?")[0];
        const query = new URLSearchParams(url.split("?")[1] || "");
        query.set(param, value);
        return `${baseUrl}?${query.toString()}`;
      }
