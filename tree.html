    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      img, svg { display: block; }

      :root {
        --ic-blue: #004aad;
        --ic-orange: #ff6522;
        --ic-red: #ce3f2e;
      }

      body {
        font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #fff;
        -webkit-font-smoothing: antialiased;
      }

      /* width wrapper used by the injected global nav + footer */
      .container {
        width: 100%;
        max-width: 1140px;
        margin: 0 auto;
        padding: 0 16px;
      }

      /* Center the injected global nav within its 90px bar.
         The site's template CSS normally does this; this page is
         standalone, so replicate it here. The #nav-placeholder id
         outranks navbar.js's single-class rules. */
      #nav-placeholder.header-area {
        display: flex;
        align-items: center;
      }
      #nav-placeholder .main-nav {
        height: auto;
      }

      .tree-main {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 56px 22px;
      }

      .tree {
        width: 100%;
        max-width: 460px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      /* ===== LOGO ===== */
      .tree-logo {
        width: 100%;
        max-width: 260px;
        margin-bottom: 32px;
      }
      .tree-logo img { width: 100%; height: auto; }

      /* ===== SOCIAL ICONS ===== */
      .tree-social {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin-bottom: 40px;
      }
      .tree-social a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        color: var(--ic-red);
        background: rgba(206, 63, 46, 0.10);
        transition: background 0.15s ease, transform 0.15s ease;
      }
      .tree-social a:hover {
        background: rgba(206, 63, 46, 0.18);
        transform: translateY(-2px);
      }
      .tree-social svg { width: 24px; height: 24px; fill: currentColor; }
      .tree-social a:focus-visible {
        outline: 3px solid var(--ic-red);
        outline-offset: 3px;
      }

      /* ===== BUTTONS ===== */
      .tree-links {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .tree-btn {
        display: block;
        width: 100%;
        padding: 19px 24px;
        border-radius: 999px;
        background: var(--ic-orange);
        color: #fff;
        font-weight: 700;
        font-size: 1.08rem;
        text-decoration: none;
        box-shadow: 0 10px 26px rgba(255, 101, 34, 0.28);
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }
      .tree-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(255, 101, 34, 0.38);
        background: #e6571a;
      }
      .tree-btn:focus-visible {
        outline: 3px solid var(--ic-red);
        outline-offset: 3px;
      }

      .seo-heading {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
