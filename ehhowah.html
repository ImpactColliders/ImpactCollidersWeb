<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Eh Let's Play - Login</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="register.js" defer></script>
</head>
<body>
  <div class="background"></div>




  <form id="codeForm" class="form-box active">
  <h3>Enter Code to Play</h3>

  <label>Unique Code</label>
  <input id="code-input" type="text" placeholder="Enter your unique code" required />

  <button id="code-submit" type="submit">Play</button>
  <p id="code-error" class="error"></p>
</form>


  <script>
    function switchForm(form) {
      document.getElementById("loginForm").classList.remove("active");
      document.getElementById("registerForm").classList.remove("active");
      if (form === "login") document.getElementById("loginForm").classList.add("active");
      else document.getElementById("registerForm").classList.add("active");
    }
  </script>
</body>
</html>
