<style>

/* PAGE BACKGROUND */
.play-section{
background:#cf3d2d;
min-height:80vh;
display:flex;
align-items:center;
justify-content:center;
padding:120px 20px;
}

/* MAIN LAYOUT */

.play-container{
display:flex;
align-items:center;
gap:140px;
}

/* OTTER */

.otter img{
width:420px;
}

/* RIGHT SIDE */

.play-ui{
display:flex;
flex-direction:column;
gap:40px;
}

/* SPEECH BOX */

.speech-box{
background:#eae6e3;
padding:50px;
border-radius:14px;
width:450px;
box-shadow:10px 10px 0 #8f2a1d;
position:relative;
}

.speech-box:before{
content:"";
position:absolute;
left:-38px;
top:80px;
border-width:22px;
border-style:solid;
border-color:transparent #eae6e3 transparent transparent;
}

.speech-box h3{
text-align:center;
color:#004aad;
font-weight:600;
margin-bottom:25px;
}

.speech-box input{
width:100%;
padding:15px;
border-radius:6px;
border:2px solid #e75a43;
margin-bottom:20px;
font-size:16px;
}

.play-btn{
width:100%;
padding:15px;
background:#d44732;
color:white;
border:none;
border-radius:6px;
font-weight:600;
cursor:pointer;
font-size:16px;
}

.play-btn:hover{
background:#b83a28;
}

.hint{
font-size:13px;
color:#004aad;
text-align:center;
margin-top:12px;
}

/* PURCHASE BOX */

.purchase-box{
background:white;
padding:30px;
border-radius:12px;
box-shadow:10px 10px 0 #8f2a1d;
text-align:center;
width:450px;
}

.purchase-btn{
display:block;
margin-top:20px;
background:#d44732;
color:white;
border:none;
padding:14px;
border-radius:6px;
width:100%;
font-weight:600;
cursor:pointer;
text-align:center;
}

.purchase-btn:hover{
background:#b83a28;
}
/* MOBILE */

@media (max-width:900px){

.play-section{
padding:100px 18px;
align-items:flex-start;
}

.play-container{
flex-direction:column;
gap:40px;
width:100%;
}

/* OTTER */

.otter{
display:flex;
justify-content:center;
}

.otter img{
width:240px;
max-width:80%;
}

/* UI STACK */

.play-ui{
width:100%;
align-items:center;
gap:30px;
}

/* SPEECH BOX */

.speech-box{
width:100%;
max-width:380px;
padding:32px 26px;
box-shadow:8px 8px 0 #8f2a1d;
}

/* remove desktop arrow */

.speech-box:before{
display:none;
}

/* PURCHASE */

.purchase-box{
width:100%;
max-width:380px;
padding:24px;
box-shadow:8px 8px 0 #8f2a1d;
}

/* TEXT */

.speech-box h3{
font-size:22px;
}

.hint{
font-size:12px;
}


}

</style>
