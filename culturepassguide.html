<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Culture Pass Guide – Impact Colliders</title>
<meta name="description" content="How to use your SG Culture Pass to pay for a ticket to The Archive."/>

<link rel="icon" type="image/x-icon" href="/assets/images/logo.jpg"/>
<link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700&display=swap" rel="stylesheet"/>

<style>
:root{
  --brand:#004aad;
  --brand-deep:#003680;
  --brand-soft:rgba(0,74,173,0.08);
  --brand-tint:#eef3fb;
  --ink:#0f172a;
  --ink-muted:#5b6473;
  --border:#e3e6ec;
  --surface:#ffffff;
  --shadow-card:0 1px 2px rgba(16,24,40,0.04), 0 14px 36px rgba(16,24,40,0.07);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--brand-tint) 0%,#ffffff 55%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:48px 20px;
}

.cpg-card{
  width:100%;
  max-width:560px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:28px;
  box-shadow:var(--shadow-card);
  padding:40px 34px 34px;
}

.cpg-logo{
  width:56px;
  height:56px;
  border-radius:14px;
  object-fit:cover;
  display:block;
  margin:0 auto 18px;
}

.cpg-title{
  font-size:27px;
  font-weight:700;
  letter-spacing:-0.01em;
  text-align:center;
  margin:0 0 8px;
}

.cpg-intro{
  font-size:15.5px;
  line-height:1.5;
  color:var(--ink-muted);
  text-align:center;
  margin:0 0 30px;
}

/* STEPS */
.cpg-steps{
  list-style:none;
  margin:0 0 32px;
  padding:0;
  counter-reset:step;
}
.cpg-steps li{
  position:relative;
  counter-increment:step;
  padding:5px 0 5px 52px;
  min-height:36px;
  margin-bottom:16px;
  font-size:15.5px;
  line-height:1.55;
}
.cpg-steps li:last-child{margin-bottom:0;}
.cpg-steps li::before{
  content:counter(step);
  position:absolute;
  left:0;
  top:0;
  width:36px;
  height:36px;
  border-radius:999px;
  background:var(--brand);
  color:#fff;
  font-weight:600;
  font-size:15px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.cpg-steps a{
  color:var(--brand);
  font-weight:600;
  text-decoration:none;
  word-break:break-word;
}
.cpg-steps a:hover{text-decoration:underline;}

/* BUTTON */
.cpg-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:54px;
  padding:0 22px;
  border-radius:999px;
  font-family:inherit;
  font-size:15.5px;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
  border:1.5px solid var(--brand);
  background:var(--brand);
  color:#fff;
  box-shadow:0 1px 2px rgba(0,74,173,0.25), 0 8px 20px rgba(0,74,173,0.20);
  transition:background .15s ease, box-shadow .15s ease, transform .12s ease;
  -webkit-tap-highlight-color:transparent;
}
.cpg-btn:hover{
  background:var(--brand-deep);
  border-color:var(--brand-deep);
  box-shadow:0 1px 2px rgba(0,74,173,0.3), 0 12px 26px rgba(0,74,173,0.28);
  transform:translateY(-2px);
}
.cpg-btn:active{transform:translateY(0);}
.cpg-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--brand-soft);}

@media(max-width:480px){
  body{padding:28px 14px;}
  .cpg-card{padding:32px 22px 26px;border-radius:22px;}
  .cpg-title{font-size:24px;}
}
</style>
</head>
<body>

<main class="cpg-card">
  <img class="cpg-logo" src="/assets/images/logo.jpg" alt="Impact Colliders"/>
  <h1 class="cpg-title">Culture Pass Guide</h1>
  <p class="cpg-intro">How to use your SG Culture Pass to pay for a ticket to The Archive.</p>

  <ol class="cpg-steps">
    <li>Log in to SG Culture Pass with Singpass.</li>
    <li>Select <a href="https://www.impactcolliders.com/thearchive/">The Archive event</a>.</li>
    <li>Choose &ldquo;SG Culture Pass&rdquo; at checkout.</li>
    <li>Confirm your booking and enjoy the event.</li>
  </ol>

  <a class="cpg-btn" id="cpg-pseudo-app" href="#" target="_blank" rel="noopener">Culture Pass Pseudo App</a>
</main>

<script>
  // ---------------------------------------------------------------
  // Set this to the Culture Pass simulation/demo URL when it's ready.
  // The button opens it in a new tab so users can try Culture Pass in
  // a simulated environment. (Placeholder for now.)
  var CULTURE_PASS_DEMO_URL = "";
  // ---------------------------------------------------------------

  (function(){
    var btn = document.getElementById("cpg-pseudo-app");
    if(CULTURE_PASS_DEMO_URL){
      btn.href = CULTURE_PASS_DEMO_URL;
    } else {
      btn.addEventListener("click", function(e){
        e.preventDefault();
        alert("The Culture Pass Pseudo App is coming soon.");
      });
    }
  })();
</script>

</body>
</html>
