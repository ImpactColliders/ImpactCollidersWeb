<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="description"
      content="Press release from Impact Colliders."
    />
    <meta name="author" content="Impact Colliders" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://www.impactcolliders.com/press-release" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Impact Colliders" />
    <meta property="og:title" content="Press Release - Impact Colliders" />
    <meta property="og:description" content="Read the latest press release from Impact Colliders." />
    <meta property="og:url" content="https://www.impactcolliders.com/press-release" />
    <meta property="og:image" content="https://www.impactcolliders.com/assets/images/logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Press Release - Impact Colliders" />
    <meta name="twitter:description" content="Read the latest press release from Impact Colliders." />
    <meta name="twitter:image" content="https://www.impactcolliders.com/assets/images/logo.jpg" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap"
      rel="stylesheet"
    />
    <title>Press Release - Impact Colliders</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/logo.jpg" />
    <link
      rel="stylesheet"
      type="text/css"
      href="assets/css/bootstrap.min.css"
    />
    <link rel="stylesheet" type="text/css" href="assets/css/font-awesome.css" />
    <link rel="stylesheet" href="assets/css/templatemo-lava.css" />
    <link rel="stylesheet" href="assets/css/owl-carousel.css" />
    <style>
      body {
        font-family: Poppins, sans-serif;
        background: #f5f5f5;
      }

      .page-hero {
        padding: 140px 10% 40px;
        text-align: center;
        background: #ffffff;
      }
      .page-hero .eyebrow {
        display: inline-block;
        font-size: 13px;
        font-weight: 600;
        color: #ff6b6b;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 14px;
      }
      .page-hero h1 {
        font-size: 38px;
        font-weight: 700;
        color: #004aad;
        margin-bottom: 14px;
        line-height: 1.25;
      }
      .page-hero .meta {
        font-size: 14px;
        color: #888;
      }

      .article {
        max-width: 820px;
        margin: 0 auto;
        padding: 50px 20px 80px;
      }

      .article-image {
        width: 100%;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        margin-bottom: 36px;
        background: #fff;
        text-align: center;
      }
      .article-image img {
        max-width: 100%;
        max-height: 620px;
        height: auto;
        display: inline-block;
      }

      .article-body {
        background: #fff;
        border-radius: 16px;
        padding: 40px 44px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      }
      .article-body p {
        font-size: 16px;
        line-height: 1.75;
        color: #444;
        margin-bottom: 18px;
      }
      .article-body h2 {
        font-size: 22px;
        font-weight: 700;
        color: #004aad;
        margin: 30px 0 14px;
      }
      .article-body ul {
        padding-left: 22px;
        margin-bottom: 18px;
      }
      .article-body ul li {
        font-size: 16px;
        line-height: 1.75;
        color: #444;
        margin-bottom: 6px;
      }

      .article-cta {
        text-align: center;
        margin-top: 36px;
      }
      .article-cta-link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #ff6b6b;
        color: #fff;
        padding: 14px 28px;
        border-radius: 10px;
        font-weight: 600;
        text-decoration: none;
        transition: 0.3s;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .article-cta-link:hover {
        transform: translateY(-3px);
        background: #ff5252;
        color: #fff;
        text-decoration: none;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #004aad;
        font-weight: 600;
        text-decoration: none;
        margin-bottom: 24px;
        font-size: 14px;
      }
      .back-link:hover {
        color: #003580;
        text-decoration: none;
      }

      .not-found {
        text-align: center;
        padding: 60px 20px;
        color: #666;
      }
      .not-found a {
        color: #004aad;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .page-hero {
          padding: 120px 6% 30px;
        }
        .page-hero h1 {
          font-size: 26px;
        }
        .article {
          padding: 30px 16px 60px;
        }
        .article-body {
          padding: 26px 22px;
        }
        .article-body h2 {
          font-size: 19px;
        }
      }
    </style>
  </head>

  <body>
    <div id="preloader">
      <div class="jumper">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>

    <!-- Nav Bar -->
    <header class="header-area header-sticky" id="nav-placeholder"></header>

    <!-- Hero (rendered) -->
    <section class="page-hero" id="press-hero"></section>

    <!-- Article (rendered) -->
    <main id="press-article"></main>

    <!-- Footer -->
    <footer id="contact-us">
      <div class="container" id="contact-container">
        <!-- Contact form will be injected here -->
      </div>
    </footer>

    <script src="press-releases-data.js"></script>
    <script>
      (function renderPressRelease() {
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug");
        const items = window.PRESS_RELEASES || [];
        const item = items.find((p) => p.slug === slug);

        const heroEl = document.getElementById("press-hero");
        const articleEl = document.getElementById("press-article");

        const escapeHtml = (str) =>
          String(str).replace(/[&<>"']/g, (c) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c]));

        const deriveSummary = (body) => {
          const tmp = document.createElement("div");
          tmp.innerHTML = body || "";
          const p = tmp.querySelector("p");
          return p ? p.textContent.replace(/\s+/g, " ").trim() : "";
        };

        if (!item) {
          heroEl.innerHTML = `
            <div class="eyebrow">Press Release</div>
            <h1>Not Found</h1>
          `;
          articleEl.innerHTML = `
            <div class="article">
              <div class="not-found">
                <p>Sorry, we couldn't find that press release.</p>
                <a href="press-releases">&larr; Back to Press Releases</a>
              </div>
            </div>
          `;
          return;
        }

        document.title = `${item.title} - Impact Colliders`;
        const pageDescription = item.summary || deriveSummary(item.body);
        const pageUrl = `${window.location.origin}${window.location.pathname}?slug=${encodeURIComponent(item.slug)}`;
        const pageImage = new URL(item.image, window.location.href).href;
        const setMeta = (selector, attr, value) => {
          const el = document.querySelector(selector);
          if (el && value) el.setAttribute(attr, value);
        };

        setMeta('meta[name="description"]', "content", pageDescription);
        setMeta('link[rel="canonical"]', "href", pageUrl);
        setMeta('meta[property="og:title"]', "content", item.title);
        setMeta('meta[property="og:description"]', "content", pageDescription);
        setMeta('meta[property="og:url"]', "content", pageUrl);
        setMeta('meta[property="og:image"]', "content", pageImage);
        setMeta('meta[name="twitter:title"]', "content", item.title);
        setMeta('meta[name="twitter:description"]', "content", pageDescription);
        setMeta('meta[name="twitter:image"]', "content", pageImage);

        heroEl.innerHTML = `
          <div class="eyebrow">Press Release</div>
          <h1>${escapeHtml(item.title)}</h1>
          <div class="meta">Published ${escapeHtml(item.date)}</div>
        `;

        const ctaHtml = item.cta
          ? `
            <div class="article-cta">
              <a
                class="article-cta-link"
                href="${escapeHtml(item.cta.href)}"
                ${item.cta.external ? 'target="_blank" rel="noopener noreferrer"' : ""}
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                ${escapeHtml(item.cta.label)}
              </a>
            </div>
          `
          : "";

        articleEl.innerHTML = `
          <article class="article">
            <a href="press-releases" class="back-link">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
              Back to Press Releases
            </a>

            <div class="article-image">
              <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.imageAlt || item.title)}" />
            </div>

            <div class="article-body">
              ${item.body}
              ${ctaHtml}
            </div>
          </article>
        `;
      })();
    </script>

    <script src="mailinglist.js"></script>
    <script src="assets/js/jquery-2.1.0.min.js"></script>
    <script src="assets/js/popper.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/owl-carousel.js"></script>
    <script src="assets/js/scrollreveal.min.js"></script>
    <script src="assets/js/waypoints.min.js"></script>
    <script src="assets/js/jquery.counterup.min.js"></script>
    <script src="assets/js/imgfix.min.js"></script>
    <script src="navbar.js"></script>
    <script src="assets/js/custom.js"></script>
  </body>
</html>
