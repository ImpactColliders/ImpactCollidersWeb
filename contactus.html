<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>Contact Us – Impact Colliders</title>

<link rel="icon" type="image/x-icon" href="/assets/images/logo.jpg"/>

<link rel="stylesheet" href="assets/css/bootstrap.min.css"/>
<link rel="stylesheet" href="assets/css/font-awesome.css"/>
<link rel="stylesheet" href="assets/css/templatemo-lava.css"/>

<style>

/* PAGE BACKGROUND */

.contact-page{
background:#f5f5f5;
padding:140px 20px 120px;
}

/* CONTACT CARD */

.contact-wrapper{
max-width:700px;
margin:auto;
background:white;
border-radius:16px;
padding:60px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* FORM */

.contact-form h2{
font-weight:700;
color:#004aad;
margin-bottom:25px;
text-align:center;
}

.contact-form input,
.contact-form textarea{
width:100%;
padding:14px;
border-radius:8px;
border:1px solid #ddd;
margin-bottom:18px;
font-size:14px;
}

.contact-form button{
background:#d44732;
color:white;
border:none;
padding:14px 28px;
border-radius:999px;
font-weight:600;
cursor:pointer;
width:100%;
}

.contact-form button:hover{
background:#b83a28;
}

/* ADDRESS BLOCK */

.contact-address{
margin-top:30px;
padding-top:25px;
border-top:1px solid #eee;
text-align:center;
}

.contact-address-label{
font-size:12px;
font-weight:600;
text-transform:uppercase;
letter-spacing:1.2px;
color:#004aad;
margin-bottom:10px;
}

.contact-address-line{
display:flex;
align-items:flex-start;
justify-content:center;
gap:10px;
color:#555;
font-size:14px;
line-height:1.6;
}

.contact-address-line svg{
flex-shrink:0;
color:#004aad;
margin-top:2px;
}

/* MOBILE */

@media(max-width:900px){

.contact-wrapper{
padding:40px 30px;
}

}

@media(max-width:600px){

.contact-page{
padding:120px 8px 100px;
}

.contact-wrapper{
padding:32px 16px;
border-radius:12px;
}

}

</style>

</head>

<body>

<!-- NAVBAR -->
<header class="header-area header-sticky" id="nav-placeholder"></header>


<!-- CONTACT SECTION -->

<section class="contact-page">

<div class="contact-wrapper">

<div class="contact-form">

<h2>Contact Us</h2>

<form id="contact">

<input name="name" type="text" placeholder="Full Name" required>

<input name="email" type="email" placeholder="Email Address" required>

<input name="subject" type="text" placeholder="Subject">

<textarea name="message" rows="5" placeholder="Your Message"></textarea>

<button type="submit">Send Message</button>

</form>

<div class="contact-address">
<div class="contact-address-label">Our Office</div>
<div class="contact-address-line">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M12 2a8 8 0 0 0-8 8c0 5.5 8 12 8 12s8-6.5 8-12a8 8 0 0 0-8-8z"/>
<circle cx="12" cy="10" r="3"/>
</svg>
<span>Block 58, #02-03A, Ngee Ann Polytechnic,<br>535 Clementi Road, Singapore 599489</span>
</div>
</div>

</div>

</div>

</section>


<!-- FOOTER (contains socials + info) -->

<footer id="contact-us">
<div class="container" id="contact-container"></div>
</footer>


<!-- SCRIPTS -->

<script src="assets/js/jquery-2.1.0.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>

<script src="navbar.js"></script>
<script src="contactus.js"></script>


<script>

document.getElementById("contact").addEventListener("submit", function(event){

event.preventDefault();

const name = document.querySelector("input[name='name']").value;
const email = document.querySelector("input[name='email']").value;
const subject = document.querySelector("input[name='subject']").value;
const message = document.querySelector("textarea[name='message']").value;

const body = encodeURIComponent(
"Name: " + name +
"\nEmail: " + email +
"\n\nMessage:\n" + message
);

const mailtoLink =
`mailto:info@impactcolliders.com?subject=${encodeURIComponent(subject)}&body=${body}`;

window.location.href = mailtoLink;

});

</script>



<footer id="contact-us">
<div class="container" id="contact-container"></div>
</footer>


<script src="mailinglist.js"></script>
<script src="assets/js/jquery-2.1.0.min.js"></script>
<script src="assets/js/popper.js"></script>
<script src="assets/js/bootstrap.min.js"></script>

<script src="navbar.js"></script>
<script src="assets/js/custom.js"></script>

</body>
</html>
