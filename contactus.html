<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>Contact Us – Impact Colliders</title>

<link rel="icon" type="image/x-icon" href="/assets/images/logo.jpg"/>

<link rel="stylesheet" href="assets/css/bootstrap.min.css"/>
<link rel="stylesheet" href="assets/css/font-awesome.css"/>
<link rel="stylesheet" href="assets/css/templatemo-lava.css"/>

<style>

/* DESIGN TOKENS */

:root{
--brand:#004aad;
--brand-soft:rgba(0,74,173,0.08);
--accent:#d44732;
--accent-hover:#b83a28;
--ink:#1a1a1a;
--ink-muted:#5a5a5a;
--border:#e3e6ec;
--border-strong:#cfd4dc;
--field-bg:#f7f8fa;
--surface:#ffffff;
--page:#f3f5f9;
--radius:14px;
--radius-sm:10px;
--shadow-card:0 1px 2px rgba(16,24,40,0.04), 0 12px 32px rgba(16,24,40,0.06);
--shadow-card-hover:0 1px 2px rgba(16,24,40,0.04), 0 18px 40px rgba(16,24,40,0.08);
}

/* PAGE */

.contact-page{
background:var(--surface);
padding:64px 24px 96px;
min-height:calc(100vh - 80px);
}

/* CONTAINER (frameless) */

.contact-wrapper{
max-width:520px;
margin:auto;
background:transparent;
padding:0;
box-shadow:none;
border-radius:0;
}

/* FORM */

.contact-form{
padding:0;
}

#contact{
display:flex;
flex-direction:column;
gap:14px;
width:100%;
}

.contact-form h2{
font-weight:700;
font-size:28px;
line-height:1.2;
color:var(--ink);
margin:0 0 28px;
text-align:center;
letter-spacing:-0.01em;
}

.contact-form h2:after{
content:"";
display:block;
width:42px;
height:3px;
background:var(--accent);
border-radius:2px;
margin:14px auto 0;
}

.contact-form input,
.contact-form textarea{
width:100%;
padding:14px 16px;
border-radius:var(--radius-sm);
border:1px solid var(--border);
background:var(--field-bg);
color:var(--ink);
font-size:15px;
font-family:inherit;
line-height:1.4;
margin:0;
transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
-webkit-appearance:none;
appearance:none;
}

.contact-form input{
height:48px;
}

.contact-form textarea{
min-height:140px;
resize:vertical;
}

.contact-form input::placeholder,
.contact-form textarea::placeholder{
color:#8a8f99;
opacity:1;
}

.contact-form input:hover,
.contact-form textarea:hover{
border-color:var(--border-strong);
}

.contact-form input:focus,
.contact-form textarea:focus{
outline:none;
border-color:var(--brand);
background:var(--surface);
box-shadow:0 0 0 4px var(--brand-soft);
}

.contact-form input:invalid:not(:placeholder-shown),
.contact-form textarea:invalid:not(:placeholder-shown){
border-color:#e0a0a0;
}

.contact-form button{
background:var(--accent);
color:#fff;
border:none;
padding:14px 28px;
border-radius:var(--radius-sm);
font-weight:600;
font-size:15px;
letter-spacing:0.01em;
cursor:pointer;
width:100%;
height:52px;
margin-top:10px;
box-shadow:0 1px 2px rgba(212,71,50,0.25), 0 6px 16px rgba(212,71,50,0.18);
transition:background .15s ease, transform .1s ease, box-shadow .15s ease;
}

.contact-form button:hover{
background:var(--accent-hover);
box-shadow:0 1px 2px rgba(212,71,50,0.3), 0 8px 22px rgba(212,71,50,0.25);
}

.contact-form button:active{
transform:translateY(1px);
box-shadow:0 1px 2px rgba(212,71,50,0.2);
}

.contact-form button:focus-visible{
outline:none;
box-shadow:0 0 0 4px rgba(212,71,50,0.25), 0 6px 16px rgba(212,71,50,0.18);
}

/* ADDRESS BLOCK */

.contact-address{
margin-top:40px;
padding-top:32px;
border-top:1px solid var(--border);
text-align:center;
}

.contact-address-label{
font-size:11px;
font-weight:700;
text-transform:uppercase;
letter-spacing:1.4px;
color:var(--brand);
margin-bottom:12px;
}

.contact-address-line{
display:flex;
align-items:flex-start;
justify-content:center;
gap:10px;
color:var(--ink-muted);
font-size:14px;
line-height:1.65;
max-width:420px;
margin:0 auto;
}

.contact-address-line svg{
flex-shrink:0;
color:var(--brand);
margin-top:3px;
}

/* TABLET */

@media(max-width:900px){

.contact-page{
padding:48px 20px 72px;
}

}

/* MOBILE */

@media(max-width:600px){

.header-area .main-nav{
min-height:64px;
}

.contact-page{
padding:24px 16px 56px;
}

.contact-form h2{
font-size:24px;
margin-bottom:24px;
}

.contact-form h2:after{
margin-top:12px;
}

.contact-form input,
.contact-form textarea{
font-size:16px;  /* prevent iOS zoom on focus */
}

.contact-address{
margin-top:36px;
padding-top:28px;
}

}

</style>

</head>

<body>

<!-- NAVBAR -->
<header class="header-area header-sticky" id="nav-placeholder"></header>


<!-- CONTACT SECTION -->

<section class="contact-page">

<div class="contact-wrapper">

<div class="contact-form">

<h2>Contact Us</h2>

<form id="contact">

<input name="name" type="text" placeholder="Full Name" required>

<input name="email" type="email" placeholder="Email Address" required>

<input name="subject" type="text" placeholder="Subject">

<textarea name="message" rows="5" placeholder="Your Message"></textarea>

<button type="submit">Send Message</button>

</form>

<div class="contact-address">
<div class="contact-address-label">Our Office</div>
<div class="contact-address-line">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M12 2a8 8 0 0 0-8 8c0 5.5 8 12 8 12s8-6.5 8-12a8 8 0 0 0-8-8z"/>
<circle cx="12" cy="10" r="3"/>
</svg>
<span>Block 58, #02-03A, Ngee Ann Polytechnic,<br>535 Clementi Road, Singapore 599489</span>
</div>
</div>

</div>

</div>

</section>


<!-- FOOTER (contains socials + info) -->

<footer id="contact-us">
<div class="container" id="contact-container"></div>
</footer>


<!-- SCRIPTS -->

<script src="assets/js/jquery-2.1.0.min.js"></script>
<script src="assets/js/bootstrap.min.js"></script>

<script src="navbar.js"></script>
<script src="contactus.js"></script>


<script>

document.getElementById("contact").addEventListener("submit", function(event){

event.preventDefault();

const name = document.querySelector("input[name='name']").value;
const email = document.querySelector("input[name='email']").value;
const subject = document.querySelector("input[name='subject']").value;
const message = document.querySelector("textarea[name='message']").value;

const body = encodeURIComponent(
"Name: " + name +
"\nEmail: " + email +
"\n\nMessage:\n" + message
);

const mailtoLink =
`mailto:info@impactcolliders.com?subject=${encodeURIComponent(subject)}&body=${body}`;

window.location.href = mailtoLink;

});

</script>



<footer id="contact-us">
<div class="container" id="contact-container"></div>
</footer>


<script src="mailinglist.js"></script>
<script src="assets/js/jquery-2.1.0.min.js"></script>
<script src="assets/js/popper.js"></script>
<script src="assets/js/bootstrap.min.js"></script>

<script src="navbar.js"></script>
<script src="assets/js/custom.js"></script>

</body>
</html>
