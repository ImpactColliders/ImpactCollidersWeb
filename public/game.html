<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Eh Let's Play</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #101010;
      font-family: system-ui, Arial;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Phone frame */
    #phone-frame {
      background: #000;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Portrait size for phone frame */
    #phone-frame.portrait {
      width: auto;
      height: 90dvh;
      aspect-ratio: 0.5;
    }

    /* Landscape size for phone frame */
    #phone-frame.landscape {
      width: 75dvw;
      height: auto;
      aspect-ratio: 2;
    }

    /* Mobile size for phone frame (fill the viewport) */
    #phone-frame.mobile {
      width: 100dvw;
      height: 100dvh;
      border-radius: 0;
      box-shadow: none;
    }

    /* Unity container inside */
    #unity-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      object-fit: contain;
    }

    /* Loading bar */
    #loading {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: 280px;
    }
    #bar {
      height: 8px;
      background: #2a2f3a;
      border-radius: 6px;
      overflow: hidden;
    }
    #bar > span {
      display: block;
      height: 100%;
      width: 0;
      background: #3aa0ff;
      transition: width .2s;
    }
    #label {
      margin-top: 8px;
      text-align: center;
      font-size: 12px;
      color: #cfd3dc;
    }

    /* Buttons OUTSIDE frame */
    #fs, #logout {
      position: fixed;
      top: 12px;
      z-index: 50;
      border: 0;
      border-radius: 8px;
      background: #1e90ff;
      color: #fff;
      font-weight: 700;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 12px;
    }
    #fs { right: 20px; }
    #logout { left: 20px; background: #ff4c4c; }

    @media (max-width: 768px) {
      #loading { bottom: 12px; width: 220px; }
    }
  </style>
</head>
<body>

  <!-- Top fixed buttons -->
  <button id="logout">🚪 Logout</button>
  <button id="fs">⛶ Fullscreen</button>

  <!-- Centered phone emulator -->
  <div id="phone-frame">
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
      <div id="loading">
        <div id="bar"><span id="prog"></span></div>
        <div id="label">Loading… 0%</div>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBFhBZWx3TUC-hdRAZ0noaD_jRTV7rgmE0",
    authDomain: "impactcolliders-afc54.firebaseapp.com",
    projectId: "impactcolliders-afc54",
    storageBucket: "impactcolliders-afc54.firebasestorage.app",
    messagingSenderId: "914866963026",
    appId: "1:914866963026:web:79dea52fc349bfe445158b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    if (user) {
      console.log("✅ Access granted:", user.email);

      let prefix = "public";
      let suffix = ".unityweb";

      const script = document.createElement("script");

      script.src = `/content/game/Build/${prefix}.loader.js`;
      script.onload = () => {
        const canvas = document.getElementById("unity-canvas");
        const prog = document.getElementById("prog");
        const label = document.getElementById("label");

        createUnityInstance(canvas, {
          dataUrl: `/content/game/Build/${prefix}.data${suffix}`,
          frameworkUrl: `/content/game/Build/${prefix}.framework.js${suffix}`,
          codeUrl: `/content/game/Build/${prefix}.wasm${suffix}`,
          streamingAssetsUrl: "/content/game/StreamingAssets",
          companyName: "Impact Colliders",
          productName: "Eh, How Ah?",
          productVersion: "0.3.4",
        }, p => {
          prog.style.width = (p * 100) + "%";
          label.textContent = "Loading… " + Math.round(p * 100) + "%";
        }).then(u => {
          document.getElementById("loading").style.display = "none";
          window.unityInstance = u;
        }).catch(e => {
          label.textContent = "Failed to load";
          console.error(e);
        });
      };
      document.body.appendChild(script);
    } else {
      console.warn("🚫 Not logged in, redirecting...");
      window.location.href = "../ehhowah";
    }
  });

  document.getElementById("logout").addEventListener("click", async () => {
    try {
      await signOut(auth);
      window.location.href = "../ehhowah";
    } catch (err) {
      console.error("Logout failed:", err);
    }
  });

  // Fullscreen handling
  const fsButton = document.getElementById("fs");
  const loButton = document.getElementById("logout");
  const canvas = document.getElementById("unity-canvas");

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }
  if (isIOS()) {
    fsButton.style.display = "none";
    loButton.style.display = "none";
  }

  fsButton.addEventListener("click", async () => {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else {
      try {
        await canvas.requestFullscreen();
      } catch (err) {
        console.warn("Fullscreen failed:", err);
      }
      if (window.unityInstance && window.unityInstance.SetFullscreen) {
        window.unityInstance.SetFullscreen(1);
      }
    }
  });

  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent); 
  const phoneFrame = document.getElementById("phone-frame");
  
  const resizePhoneFrame = (orientation) => {
    if (isMobile) {
      phoneFrame.classList.add("mobile");
    } else {
      switch(orientation) {
        case "landscape":
        case "landscape-primary":
        case "landscape-secondary":
          phoneFrame.classList.remove("portrait");
          phoneFrame.classList.add("landscape");
          break;
        case "portrait":
        case "portrait-primary":
        case "portrait-secondary":
          phoneFrame.classList.remove("landscape");
          phoneFrame.classList.add("portrait");
      }
    }

    if (screen.orientation.lock !== undefined) {
      screen.orientation.lock(orientation).catch(e => {});
    }
  };

  // When an orientation is requested by the game, resize the phone frame as appropriate.
  window.addEventListener("screenorientationrequest", ev => resizePhoneFrame(ev.detail.orientation));
 
  // Set phone frame to landscape on start.
  resizePhoneFrame("landscape");
</script>
</body>
</html>
