    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Impact Colliders" />
    <meta property="og:title" content="QR Code Generator - Impact Colliders" />
    <meta property="og:description" content="Generate a QR code for links and text with Impact Colliders' simple QR code tool." />
    <meta property="og:url" content="https://www.impactcolliders.com/qr" />
    <meta property="og:image" content="https://www.impactcolliders.com/assets/images/logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QR Code Generator - Impact Colliders" />

    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="assets/css/font-awesome.css">
    <link rel="stylesheet" href="assets/css/templatemo-lava.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f2f2f2;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .qr-section {
            padding: 100px 0;
            text-align: center;
            background-color: #fff;
        }
        .qr-section h1 {
            color: #e43f5a;
            margin-bottom: 30px;
            font-size: 36px;
        }
        .qr-section input {
            width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
        }
        .qr-section button {
            padding: 10px 20px;
            background-color: #e43f5a;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .qr-section button:hover {
            background-color: #c1324a;
        }
        #qrcode {
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <header class="header-area header-sticky">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <nav class="main-nav">
                        <a href="/" class="logo">Impact Colliders</a>
                        <ul class="nav">
                            <li><a href="/">Home</a></li>
                            <li><a href="videos?show=all">Video Library</a></li>
                            <li><a href="qr" class="active">QR Generator</a></li>
                        </ul>
                        <a class='menu-trigger'>
                            <span>Menu</span>
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <section class="qr-section">
        <div class="container">
            <h1>QR Code Generator</h1>
            <div>
                <input type="text" id="test" placeholder="Enter URL or text...">
                <button onclick="generateQRCode()">Generate</button>
            </div>
            <div id="qrcode"></div>
        </div>
    </section>

    <script>
        function generateQRCode() {
            const input = document.getElementById("test").value.trim();
            const qrCodeContainer = document.getElementById("qrcode");
            qrCodeContainer.innerHTML = "";
            if (input) {
                new QRCode(qrCodeContainer, input);
            }
        }
    </script>
    <script src="navbar.js"></script>
    <!-- ===== Static site-links footer (SEO / internal linking) =====
         Crawlable, no-JS mirror of the primary navigation. Lets search engines
         follow internal links and pass link equity across the main site and
         /thearchive/. Does NOT affect the interactive global nav (navbar.js). -->
    <nav class="ic-sitelinks" aria-label="Site links">
      <ul class="ic-sitelinks__list">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About Us</a></li>
        <li><a href="/ehhowahproduct">Eh, How Ah?</a></li>
        <li><a href="/corporates">Partner</a></li>
        <li><a href="/press-releases">Press Releases</a></li>
        <li><a href="/thearchive/">The Archive</a></li>
      </ul>
    </nav>
    <style>
      .ic-sitelinks{background:#1f1f1f;color:#fff;padding:22px 16px;font-family:inherit}
      .ic-sitelinks__list{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
        gap:10px 22px;list-style:none;margin:0 auto;padding:0;max-width:1100px}
      .ic-sitelinks__list a{color:rgba(255,255,255,.78);text-decoration:none;font-size:14px;
        font-weight:500;line-height:1.6}
      .ic-sitelinks__list a:hover{color:#fff;text-decoration:underline}
    </style>
  </body>

</html>
