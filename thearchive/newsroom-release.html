    <link rel="icon" type="image/x-icon" href="/assets/images/logo.jpg" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: Poppins, sans-serif;
        background: #f5f5f5;
        color: #14110f;
        margin: 0;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      img { max-width: 100%; }
      a { color: #004aad; text-decoration: none; }
      a:hover { text-decoration: underline; }

      /* ===== THE ARCHIVE NAV (matches /thearchive/) ===== */
      .archive-nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: #ce3f2e;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .archive-nav-inner {
        max-width: 1080px;
        margin: 0 auto;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .archive-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: #fff;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
      }
      .archive-brand:hover { text-decoration: none; color: #fff; }
      .archive-brand img {
        height: 34px; width: auto;
        background: #fff;
        padding: 5px 9px;
        border-radius: 8px;
      }
      .archive-brand-mark {
        display: inline-flex;
        align-items: center;
        color: rgba(255, 255, 255, 0.82);
        font-size: 0.85rem;
      }
      .archive-brand-mark::before {
        content: "";
        display: inline-block;
        width: 1px;
        height: 18px;
        background: rgba(255, 255, 255, 0.4);
        margin-right: 12px;
      }
      .archive-nav-links {
        display: flex;
        gap: 26px;
        list-style: none;
        margin: 0 auto;
        padding: 0;
      }
      .archive-nav-links a {
        color: rgba(255, 255, 255, 0.82);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.92rem;
        padding: 6px 0;
        border-bottom: 2px solid transparent;
        transition: color 0.15s ease, border-color 0.15s ease;
      }
      .archive-nav-links a:hover {
        color: #fff;
        text-decoration: none;
        border-color: rgba(255, 255, 255, 0.5);
      }
      .archive-nav-links a[aria-current="page"] {
        color: #fff;
        border-color: #ff6522;
      }
      .nav-register {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #ff6522;
        color: #fff;
        padding: 10px 22px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.92rem;
        text-decoration: none;
        transition: background 0.15s ease, transform 0.15s ease;
      }
      .nav-register:hover {
        background: #e6571a;
        color: #fff;
        text-decoration: none;
        transform: translateY(-1px);
      }
      @media (max-width: 820px) {
        .archive-nav-inner {
          flex-wrap: wrap;
          padding: 10px 16px;
          gap: 10px;
        }
        .archive-brand-mark { display: none; }
        .archive-brand { order: 1; }
        .nav-register { order: 2; padding: 8px 16px; font-size: 0.85rem; }
        .archive-nav-links {
          order: 3;
          width: 100%;
          justify-content: center;
          margin: 4px 0 2px;
          gap: 18px;
        }
        .archive-brand img { height: 30px; }
        .archive-nav-links a { font-size: 0.86rem; }
      }
      @media (max-width: 380px) {
        .archive-nav-links { gap: 12px; }
        .archive-nav-links a { font-size: 0.8rem; }
      }

      .page-hero {
        padding: 60px 10% 40px;
        text-align: center;
        background: #ffffff;
      }
      .page-hero .eyebrow {
        display: inline-block;
        font-size: 13px;
        font-weight: 600;
        color: #ff6b6b;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 14px;
      }
      .page-hero h1 {
        font-size: 38px;
        font-weight: 700;
        color: #004aad;
        margin-bottom: 14px;
        line-height: 1.25;
      }
      .page-hero .meta {
        font-size: 14px;
        color: #888;
      }

      .article {
        max-width: 820px;
        margin: 0 auto;
        padding: 50px 20px 80px;
      }

      .article-image {
        width: 100%;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        margin-bottom: 36px;
        background: #fff;
        text-align: center;
      }
      .article-image img {
        max-width: 100%;
        max-height: 620px;
        height: auto;
        display: inline-block;
      }

      .article-body {
        background: #fff;
        border-radius: 16px;
        padding: 40px 44px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      }
      .article-body p {
        font-size: 16px;
        line-height: 1.75;
        color: #444;
        margin-bottom: 18px;
      }
      .article-body h2 {
        font-size: 22px;
        font-weight: 700;
        color: #004aad;
        margin: 30px 0 14px;
      }
      .article-body ul {
        padding-left: 22px;
        margin-bottom: 18px;
      }
      .article-body ul li {
        font-size: 16px;
        line-height: 1.75;
        color: #444;
        margin-bottom: 6px;
      }

      .article-cta {
        text-align: center;
        margin-top: 36px;
      }
      .article-cta-link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #ff6b6b;
        color: #fff;
        padding: 14px 28px;
        border-radius: 10px;
        font-weight: 600;
        text-decoration: none;
        transition: 0.3s;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .article-cta-link:hover {
        transform: translateY(-3px);
        background: #ff5252;
        color: #fff;
        text-decoration: none;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #004aad;
        font-weight: 600;
        text-decoration: none;
        margin-bottom: 24px;
        font-size: 14px;
      }
      .back-link:hover {
        color: #003580;
        text-decoration: none;
      }

      .not-found {
        text-align: center;
        padding: 60px 20px;
        color: #666;
      }
      .not-found a {
        color: #004aad;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .page-hero {
          padding: 44px 6% 30px;
        }
        .page-hero h1 {
          font-size: 26px;
        }
        .article {
          padding: 30px 16px 60px;
        }
        .article-body {
          padding: 26px 22px;
        }
        .article-body h2 {
          font-size: 19px;
        }
      }
    </style>

  <body>
    <!-- ===== THE ARCHIVE NAV ===== -->

      <div class="archive-nav-inner">

          <img src="/assets/images/The Archive Logo Full.jpg" alt="The Archive" />

    <!-- Hero (rendered) -->

    <!-- Article (rendered) -->

    <script src="/thearchive/newsroom-data.js"></script>
    <script>
      (function renderPressRelease() {
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug");
        const items = window.ARCHIVE_NEWSROOM || [];
        const item = items.find((p) => p.slug === slug);

        const heroEl = document.getElementById("press-hero");
        const articleEl = document.getElementById("press-article");

        const escapeHtml = (str) =>
          String(str).replace(/[&<>"']/g, (c) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c]));

        const deriveSummary = (body) => {
          const tmp = document.createElement("div");
          tmp.innerHTML = body || "";
          const p = tmp.querySelector("p");
          return p ? p.textContent.replace(/\s+/g, " ").trim() : "";
        };

        if (!item) {
          heroEl.innerHTML = `
            <div class="eyebrow">Newsroom</div>
            <h1>Not Found</h1>
          `;
          articleEl.innerHTML = `
            <div class="article">
              <div class="not-found">
                <p>Sorry, we couldn't find that release.</p>
                <a href="/thearchive/newsroom">&larr; Back to Newsroom</a>
              </div>
            </div>
          `;
          return;
        }

        document.title = `${item.title} - The Archive | Impact Colliders`;
        const pageDescription = item.summary || deriveSummary(item.body);
        const pageUrl = `${window.location.origin}${window.location.pathname}?slug=${encodeURIComponent(item.slug)}`;
        const pageImage = new URL(item.image, window.location.href).href;
        const setMeta = (selector, attr, value) => {
          const el = document.querySelector(selector);
          if (el && value) el.setAttribute(attr, value);
        };

        setMeta('meta[name="description"]', "content", pageDescription);
        setMeta('link[rel="canonical"]', "href", pageUrl);
        setMeta('meta[property="og:title"]', "content", item.title);
        setMeta('meta[property="og:description"]', "content", pageDescription);
        setMeta('meta[property="og:url"]', "content", pageUrl);
        setMeta('meta[property="og:image"]', "content", pageImage);
        setMeta('meta[name="twitter:title"]', "content", item.title);
        setMeta('meta[name="twitter:description"]', "content", pageDescription);
        setMeta('meta[name="twitter:image"]', "content", pageImage);

        heroEl.innerHTML = `
          <div class="eyebrow">Newsroom</div>
          <h1>${escapeHtml(item.title)}</h1>
          <div class="meta">Published ${escapeHtml(item.date)}</div>
        `;

        const ctaHtml = item.cta
          ? `
            <div class="article-cta">
              <a
                class="article-cta-link"
                href="${escapeHtml(item.cta.href)}"
                ${item.cta.external ? 'target="_blank" rel="noopener noreferrer"' : ""}
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                ${escapeHtml(item.cta.label)}
              </a>
            </div>
          `
          : "";

        articleEl.innerHTML = `
          <article class="article">
            <a href="/thearchive/newsroom" class="back-link">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
              Back to Newsroom
            </a>

            <div class="article-image">
              <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.imageAlt || item.title)}" />
            </div>

            <div class="article-body">
              ${item.body}
              ${ctaHtml}
            </div>
          </article>
        `;
      })();
    </script>

    <!-- Main-site footer injector -->
    <script src="/mailinglist.js"></script>
