    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: Poppins, sans-serif;
        background: #f5f5f5;
        color: #14110f;
        margin: 0;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      img { max-width: 100%; }
      a { color: #004aad; text-decoration: none; }
      a:hover { text-decoration: underline; }

      /* ===== THE ARCHIVE NAV (matches /thearchive/) ===== */
      .archive-nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: #ce3f2e;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .archive-nav-inner {
        max-width: 1080px;
        margin: 0 auto;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .archive-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: #fff;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
      }
      .archive-brand:hover { text-decoration: none; color: #fff; }
      .archive-brand img {
        height: 34px; width: auto;
        background: #fff;
        padding: 5px 9px;
        border-radius: 8px;
      }
      .archive-brand-mark {
        display: inline-flex;
        align-items: center;
        color: rgba(255, 255, 255, 0.82);
        font-size: 0.85rem;
      }
      .archive-brand-mark::before {
        content: "";
        display: inline-block;
        width: 1px;
        height: 18px;
        background: rgba(255, 255, 255, 0.4);
        margin-right: 12px;
      }
      .archive-nav-links {
        display: flex;
        gap: 26px;
        list-style: none;
        margin: 0 auto;
        padding: 0;
      }
      .archive-nav-links a {
        color: rgba(255, 255, 255, 0.82);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.92rem;
        padding: 6px 0;
        border-bottom: 2px solid transparent;
        transition: color 0.15s ease, border-color 0.15s ease;
      }
      .archive-nav-links a:hover {
        color: #fff;
        text-decoration: none;
        border-color: rgba(255, 255, 255, 0.5);
      }
      .archive-nav-links a[aria-current="page"] {
        color: #fff;
        border-color: #ff6522;
      }
      .nav-register {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #ff6522;
        color: #fff;
        padding: 10px 22px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.92rem;
        text-decoration: none;
        transition: background 0.15s ease, transform 0.15s ease;
      }
      .nav-register:hover {
        background: #e6571a;
        color: #fff;
        text-decoration: none;
        transform: translateY(-1px);
      }
      @media (max-width: 820px) {
        .archive-nav-inner {
          flex-wrap: wrap;
          padding: 10px 16px;
          gap: 10px;
        }
        .archive-brand-mark { display: none; }
        .archive-brand { order: 1; }
        .nav-register { order: 2; padding: 8px 16px; font-size: 0.85rem; }
        .archive-nav-links {
          order: 3;
          width: 100%;
          justify-content: center;
          margin: 4px 0 2px;
          gap: 18px;
        }
        .archive-brand img { height: 30px; }
        .archive-nav-links a { font-size: 0.86rem; }
      }
      @media (max-width: 380px) {
        .archive-nav-links { gap: 12px; }
        .archive-nav-links a { font-size: 0.8rem; }
      }

      .section {
        padding: 60px 0 80px;
      }

      .page-hero {

        text-align: center;
        background: #ffffff;
      }
      .page-hero h1 {
        font-size: 42px;
        font-weight: 700;
        color: #004aad;
        margin-bottom: 20px;

        color: #666;
        line-height: 1.6;
      }
      .page-hero .hero-contact {

        font-size: 15px;
      }

      /* ===== JUMP BUTTONS ===== */
      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
      }
      section[id] { scroll-margin-top: 80px; }
      .jump-links {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 22px;
      }
      .jump-btn {

        align-items: center;

        padding: 6px 16px;

        color: #004aad;
        border: 1.5px solid #004aad;

        font-weight: 600;

      /* ===== SOCIAL ICONS (same as The Archive Linktree) ===== */
      .tree-social {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        margin: 24px 0 6px;
      }
      .tree-social a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #fff;
        color: #ff6522;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
      }
      .tree-social a:hover {
        background: #ff6522;
        color: #fff;
        transform: translateY(-2px);
      }
      .tree-social a:focus-visible {
        outline: 3px solid #004aad;
        outline-offset: 3px;
      }
      .tree-social svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }

      .press-list {
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 20px;
        display: grid;
        gap: 30px;
      }

      .press-empty {
        text-align: center;
        color: #888;
        padding: 40px 20px;
      }

      .press-card {
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        display: grid;
        grid-template-columns: 280px 1fr;
        transition: transform 0.3s, box-shadow 0.3s;
      }
      .press-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
      }

      .press-card-image {
        width: 280px;
        aspect-ratio: 1 / 1;
        background-color: #eee;
      }
      .press-card-image a {
        display: block;
        width: 100%;
        height: 100%;
      }
      .press-card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        display: block;
      }

      .press-card-body {
        padding: 28px 30px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .press-card-date {
        font-size: 13px;
        font-weight: 600;
        color: #ff6b6b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }

      .press-card-title {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 12px;
        line-height: 1.3;
      }
      .press-card-title a {
        color: #004aad;
        text-decoration: none;
      }
      .press-card-title a:hover {
        color: #003580;
        text-decoration: none;
      }

      .press-card-summary {
        font-size: 15px;
        color: #555;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .press-card-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #ff6b6b;
        color: #fff;
        padding: 10px 22px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        transition: 0.3s;
        align-self: flex-start;
      }
      .press-card-link:hover {
        transform: translateY(-2px);
        background: #ff5252;
        color: #fff;
        text-decoration: none;
      }
      .press-card-link svg {
        flex-shrink: 0;
      }

      @media (max-width: 768px) {
        .page-hero {

        }
        .press-card {
          grid-template-columns: 1fr;
        }
        .press-card-image {
          width: 100%;

          max-height: 420px;
        }
        .press-card-body {
          padding: 22px 22px 26px;
        }
        .press-card-title {
          font-size: 19px;
        }
      }

    <script>
      (function renderPressList() {
        const container = document.getElementById("press-list");
        const items = (window.ARCHIVE_NEWSROOM || []);

        if (!items.length) {
          container.innerHTML =
            '<div class="press-empty">No newsroom updates yet. Check back soon.</div>';
          return;
        }

        const escapeHtml = (str) =>
          String(str).replace(/[&<>"']/g, (c) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c]));

        const deriveSummary = (body) => {
          const tmp = document.createElement("div");
          tmp.innerHTML = body || "";
          const p = tmp.querySelector("p");
          return p ? p.textContent.replace(/\s+/g, " ").trim() : "";
        };

        container.innerHTML = items
          .map((item) => {
            const href = `/thearchive/newsroom-release?slug=${encodeURIComponent(item.slug)}`;
            const alt = escapeHtml(item.imageAlt || item.title);
            const summary = item.summary || deriveSummary(item.body);
            return `
              <article class="press-card">
                <div class="press-card-image">
                  <a href="${href}">
                    <img src="${escapeHtml(item.image)}" alt="${alt}" />
                  </a>
                </div>
                <div class="press-card-body">
                  <div class="press-card-date">${escapeHtml(item.date)}</div>
                  <h2 class="press-card-title">
                    <a href="${href}">${escapeHtml(item.title)}</a>
                  </h2>
                  <p class="press-card-summary">${escapeHtml(summary)}</p>
                  <a class="press-card-link" href="${href}">
                    Read More
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                      <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                  </a>
                </div>
              </article>
            `;
          })
          .join("");
      })();
    </script>
