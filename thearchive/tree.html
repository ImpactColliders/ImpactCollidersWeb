    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      img { display: block; max-width: 100%; }

      :root {
        --ic-blue: #004aad;
        --ic-orange: #ff6522;
        --ic-red: #ce3f2e;
        --brand: #ff6522;
        --brand-hover: #e6571a;
        --text: #14110f;
      }

      body {
        font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(120% 80% at 50% 0%, rgba(255, 101, 34, 0.10), transparent 60%),
          radial-gradient(120% 80% at 50% 100%, rgba(0, 74, 173, 0.08), transparent 60%),
          #f5f5f5;
        -webkit-font-smoothing: antialiased;
      }

      /* ===== DEDICATED NAV (shared with The Archive home) ===== */
      .archive-nav {
        position: sticky; top: 0; z-index: 100;
        background: var(--ic-red);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .archive-nav-inner {
        max-width: 1080px; margin: 0 auto;
        padding: 12px 24px;
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px;
      }
      .archive-brand {
        display: inline-flex; align-items: center; gap: 12px;
        color: #fff; font-weight: 600; font-size: 0.95rem;
        text-decoration: none;
      }
      .archive-brand:hover { text-decoration: none; color: #fff; }
      .archive-brand img {
        height: 34px; width: auto;
        background: #fff;
        padding: 5px 9px;
        border-radius: 8px;
      }
      .archive-nav-links {
        display: flex; gap: 26px; list-style: none;
        margin: 0 auto; padding: 0;
      }
      .archive-nav-links a {
        color: rgba(255, 255, 255, 0.82);
        text-decoration: none;
        font-weight: 500; font-size: 0.92rem;
        padding: 6px 0;
        border-bottom: 2px solid transparent;
        transition: color 0.15s, border-color 0.15s;
      }
      .archive-nav-links a:hover {
        color: #fff; text-decoration: none;
        border-color: rgba(255, 255, 255, 0.5);
      }
      .archive-nav-links a[aria-current="page"] {
        color: #fff; border-color: var(--brand);
      }
      .nav-register {
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--brand); color: #fff;
        padding: 10px 22px; border-radius: 999px;
        font-weight: 600; font-size: 0.92rem;
        text-decoration: none;
        transition: background 0.15s, transform 0.15s;
      }
      .nav-register:hover {
        background: var(--brand-hover); color: #fff;
        text-decoration: none; transform: translateY(-1px);
      }
      @media (max-width: 820px) {
        .archive-nav-inner {
          flex-wrap: wrap;
          padding: 10px 16px;
          gap: 10px;
        }
        .archive-brand { order: 1; }
        .nav-register { order: 2; padding: 8px 16px; font-size: 0.85rem; }
        .archive-nav-links {
          order: 3;
          width: 100%;
          justify-content: center;
          margin: 4px 0 2px;
          gap: 18px;
        }
        .archive-brand img { height: 30px; }
        .archive-nav-links a { font-size: 0.86rem; }
      }
      @media (max-width: 380px) {
        .archive-nav-links { gap: 12px; }
        .archive-nav-links a { font-size: 0.8rem; }
      }

      .tree-main {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
      }

      .tree {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      .tree-logo {
        background: #fff;
        border-radius: 20px;
        padding: 26px 28px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.08);
        margin-bottom: 18px;
      }
      .tree-logo img {
        width: 100%;
        max-width: 280px;
        height: auto;
        margin: 0 auto;
      }

      .tree-social {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        margin-bottom: 44px;
      }
      .tree-social a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #fff;
        color: var(--brand);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
      }
      .tree-social a:hover {
        background: var(--brand);
        color: #fff;
        transform: translateY(-2px);
      }
      .tree-social a:focus-visible {
        outline: 3px solid var(--ic-blue);
        outline-offset: 3px;
      }
      .tree-social svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }

      .tree-links {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .tree-btn {
        display: block;
        width: 100%;
        padding: 17px 24px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 1.05rem;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }
      .tree-btn:focus-visible {
        outline: 3px solid var(--ic-blue);
        outline-offset: 3px;
      }

      .tree-btn.primary {
        background: var(--brand);
        color: #fff;
        box-shadow: 0 8px 22px rgba(255, 101, 34, 0.28);
      }
      .tree-btn.primary:hover {
        background: var(--brand-hover);
        transform: translateY(-2px);
      }

      .tree-btn.secondary {
        background: #fff;
        color: var(--brand);
        border: 2px solid var(--brand);
      }
      .tree-btn.secondary:hover {
        background: var(--brand);
        color: #fff;
        transform: translateY(-2px);
      }

      .tree-btn.share {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: auto;
        margin: 28px auto 0;
        padding: 13px 28px;
        background: #fff;
        color: var(--ic-blue);
        border: 2px solid var(--ic-blue);
        font-size: 0.95rem;
        cursor: pointer;
        font-family: inherit;
      }
      .tree-btn.share:hover {
        background: var(--ic-blue);
        color: #fff;
        transform: translateY(-2px);
      }
      .tree-btn.share svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }

      /* ===== QR code sharing (compact, à la the name cards) ===== */
      .tree-qr {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: 28px;
      }

      /* compact pill buttons — small, light, secondary feel */
      .tree-qr-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: #6b6460;
        cursor: pointer;
        padding: 9px 20px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        background: rgba(255, 255, 255, 0.65);
        transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .tree-qr-link svg {
        width: 15px;
        height: 15px;
        fill: none;
        flex-shrink: 0;
      }
      .tree-qr-link:hover {
        color: var(--brand);
        border-color: rgba(0, 0, 0, 0.22);
      }
      .tree-qr-link:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(255, 101, 34, 0.22);
      }
      .tree-qr-link[hidden] { display: none; }

      /* download = the less prominent of the two */
      .tree-qr-download {
        font-size: 12px;
        padding: 7px 16px;
        color: #8a837e;
        background: transparent;
      }
      .tree-qr-download svg { width: 14px; height: 14px; }

      .tree-qr-panel {
        background: #fff;
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08);
        line-height: 0;
      }
      .tree-qr-panel[hidden] { display: none; }
      .tree-qr-panel img {
        width: 200px;
        max-width: 55vw;
        height: auto;
        margin: 0 auto;
      }

      .seo-heading {

        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

    <script>
      (function () {
        var PAGE_URL = "https://www.impactcolliders.com/thearchive/tree";

        /* ----- QR code for this page (same approach as the name cards) ----- */
        var qrToggle = document.getElementById("qrToggle");
        var qrToggleLabel = document.getElementById("qrToggleLabel");
        var qrPanel = document.getElementById("qrPanel");
        var qrDownload = document.getElementById("qrDownload");

        var _qrDataUrl = null;
        function getQRDataUrl(cb) {
          if (_qrDataUrl) { cb(_qrDataUrl); return; }
          if (typeof QRCode === "undefined") { cb(null); return; }
          var holder = document.createElement("div");
          holder.style.display = "none";
          document.body.appendChild(holder);
          new QRCode(holder, {
            text: PAGE_URL,
            width: 512,
            height: 512,
            correctLevel: QRCode.CorrectLevel.H
          });
          setTimeout(function () {
            var canvas = holder.querySelector("canvas");
            var img = holder.querySelector("img");
            _qrDataUrl = canvas ? canvas.toDataURL("image/png") : (img ? img.src : null);
            document.body.removeChild(holder);
            cb(_qrDataUrl);
          }, 80);
        }

        if (qrToggle && qrPanel) {
          qrToggle.addEventListener("click", function () {
            var showing = !qrPanel.hasAttribute("hidden");
            if (showing) {
              qrPanel.setAttribute("hidden", "");
              if (qrDownload) qrDownload.setAttribute("hidden", "");
              qrToggle.setAttribute("aria-expanded", "false");
              if (qrToggleLabel) qrToggleLabel.textContent = "Show QR Code";
              return;
            }
            if (!qrPanel.firstChild) {
              getQRDataUrl(function (dataUrl) {
                if (!dataUrl) { window.open("/qr", "_blank", "noopener"); return; }
                var img = document.createElement("img");
                img.src = dataUrl;
                img.alt = "QR code linking to The Archive links page";
                qrPanel.appendChild(img);
              });
            }
            qrPanel.removeAttribute("hidden");
            if (qrDownload) qrDownload.removeAttribute("hidden");
            qrToggle.setAttribute("aria-expanded", "true");
            if (qrToggleLabel) qrToggleLabel.textContent = "Hide QR Code";
          });
        }

        if (qrDownload) {
          qrDownload.addEventListener("click", function () {
            getQRDataUrl(function (dataUrl) {
              if (!dataUrl) { window.open("/qr", "_blank", "noopener"); return; }
              var a = document.createElement("a");
              a.href = dataUrl;
              a.download = "TheArchive_Links_QR.png";
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            });
          });
        }
      })();
    </script>
