    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      img { display: block; max-width: 100%; }

      :root {
        --ic-blue: #004aad;
        --ic-orange: #ff6522;
        --ic-red: #ce3f2e;
        --brand: #ff6522;
        --brand-hover: #e6571a;
        --text: #14110f;
      }

      body {
        font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(120% 80% at 50% 0%, rgba(255, 101, 34, 0.10), transparent 60%),
          radial-gradient(120% 80% at 50% 100%, rgba(0, 74, 173, 0.08), transparent 60%),
          #f5f5f5;
        -webkit-font-smoothing: antialiased;
      }

      /* ===== DEDICATED NAV (shared with The Archive home) ===== */
      .archive-nav {
        position: sticky; top: 0; z-index: 100;
        background: var(--ic-red);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .archive-nav-inner {
        max-width: 1080px; margin: 0 auto;
        padding: 12px 24px;
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px;
      }
      .archive-brand {
        display: inline-flex; align-items: center; gap: 12px;
        color: #fff; font-weight: 600; font-size: 0.95rem;
        text-decoration: none;
      }
      .archive-brand:hover { text-decoration: none; color: #fff; }
      .archive-brand img {
        height: 34px; width: auto;
        background: #fff;
        padding: 5px 9px;
        border-radius: 8px;
      }
      .archive-nav-links {
        display: flex; gap: 26px; list-style: none;
        margin: 0 auto; padding: 0;
      }
      .archive-nav-links a {
        color: rgba(255, 255, 255, 0.82);
        text-decoration: none;
        font-weight: 500; font-size: 0.92rem;
        padding: 6px 0;
        border-bottom: 2px solid transparent;
        transition: color 0.15s, border-color 0.15s;
      }
      .archive-nav-links a:hover {
        color: #fff; text-decoration: none;
        border-color: rgba(255, 255, 255, 0.5);
      }
      .archive-nav-links a[aria-current="page"] {
        color: #fff; border-color: var(--brand);
      }
      .nav-register {
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--brand); color: #fff;
        padding: 10px 22px; border-radius: 999px;
        font-weight: 600; font-size: 0.92rem;
        text-decoration: none;
        transition: background 0.15s, transform 0.15s;
      }
      .nav-register:hover {
        background: var(--brand-hover); color: #fff;
        text-decoration: none; transform: translateY(-1px);
      }
      @media (max-width: 820px) {
        .archive-nav-inner {
          flex-wrap: wrap;
          padding: 10px 16px;
          gap: 10px;
        }
        .archive-brand { order: 1; }
        .nav-register { order: 2; padding: 8px 16px; font-size: 0.85rem; }
        .archive-nav-links {
          order: 3;
          width: 100%;
          justify-content: center;
          margin: 4px 0 2px;
          gap: 18px;
        }
        .archive-brand img { height: 30px; }
        .archive-nav-links a { font-size: 0.86rem; }
      }
      @media (max-width: 380px) {
        .archive-nav-links { gap: 12px; }
        .archive-nav-links a { font-size: 0.8rem; }
      }

      .tree-main {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
      }

      .tree {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      .tree-logo {
        background: #fff;
        border-radius: 20px;
        padding: 26px 28px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.08);
        margin-bottom: 36px;
      }
      .tree-logo img {
        width: 100%;
        max-width: 280px;
        height: auto;
        margin: 0 auto;
      }

      .tree-links {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .tree-btn {
        display: block;
        width: 100%;
        padding: 17px 24px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 1.05rem;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }
      .tree-btn:focus-visible {
        outline: 3px solid var(--ic-blue);
        outline-offset: 3px;
      }

      .tree-btn.primary {
        background: var(--brand);
        color: #fff;
        box-shadow: 0 8px 22px rgba(255, 101, 34, 0.28);
      }
      .tree-btn.primary:hover {
        background: var(--brand-hover);
        transform: translateY(-2px);
      }

      .tree-btn.secondary {
        background: #fff;
        color: var(--brand);
        border: 2px solid var(--brand);
      }
      .tree-btn.secondary:hover {
        background: var(--brand);
        color: #fff;
        transform: translateY(-2px);
      }

      .seo-heading {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
